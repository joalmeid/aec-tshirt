<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AEC 2026 — T-shirt 3D (produção)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000; /* simulates the website's black background */
      overflow: hidden;
    }
    babylon-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 1.1rem;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    THE PRODUCTION EMBED.

    This is the arrangement docs/production-delivery.md section 6 recommends,
    and the page a site should copy: the Babylon Viewer v2 web component,
    imported from npm, pointed at the baked model.

    It is NOT the page that proves the bake is correct — that is
    src/index-model-validation.html at /model-validation, which hand-builds an
    Engine and a Scene precisely so it can read the loaded materials back and
    assert the model carries its own appearance. Keep the two apart: one is the
    acceptance test for the asset, this one is what shipping looks like.

    What the viewer brings that the validation page hand-writes:

      3D Commerce certified by default   transparencyAsCoverage on the glTF
                                         loader, and KHR PBR Neutral as the tone
                                         mapper — the two settings section 4
                                         names, neither of them spelled out here
      dynamic extension imports          KHR_materials_sheen is fetched, Draco,
                                         KTX2 and FBX are not
      autoSuspendRendering               stops rendering when scrolled out of
                                         view or in a background tab
      WebGL / WebGPU                     chosen per device
      framing                            computed from the model

    What it cannot know stays in prod.js: exposure 1.15 and the key light.

    Attributes below are the row-two items from section 2 — the environment and
    the camera, which glTF has nowhere to store. environment-lighting is the
    important one: without an IBL the sheen lobe has nothing to reflect and the
    fabric stops reading as fabric.
  -->
  <babylon-viewer
    source="/assets/tshirt-prod.glb"
    environment-lighting="/assets/env/studio.env"
    environment-intensity="1"
    tone-mapping="neutral"
    camera-auto-orbit
    camera-auto-orbit-speed="0.1"
    camera-auto-orbit-delay="2000"
  ></babylon-viewer>

  <div id="status">A carregar…</div>

  <script type="module" src="./prod.js"></script>
</body>
</html>
