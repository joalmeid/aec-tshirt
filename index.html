<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Alimenta Esta Corrida 2026 — T-shirt 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000; /* simulates the website's black background */
      overflow: hidden;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #loading, #fallback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 1.1rem;
      text-align: center;
    }
    #fallback { display: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="loading">A carregar…</div>
  <div id="fallback">O teu navegador não suporta WebGL, necessário para esta pré-visualização 3D.</div>

  <!-- Babylon.js core + glTF/glb loader, from CDN. No build step. -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const loadingEl = document.getElementById("loading");
    const fallbackEl = document.getElementById("fallback");

    if (!BABYLON.Engine.isSupported()) {
      canvas.style.display = "none";
      loadingEl.style.display = "none";
      fallbackEl.style.display = "block";
    } else {
      const engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: true,
        stencil: true,
        alpha: true,
      });

      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); // transparent

      engine.runRenderLoop(() => {
        scene.render();
      });

      window.addEventListener("resize", () => {
        engine.resize();
      });
    }
  </script>
</body>
</html>
