<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Alimenta Esta Corrida 2026 — T-shirt 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000; /* simulates the website's black background */
      overflow: hidden;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #loading, #fallback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 1.1rem;
      text-align: center;
    }
    #fallback { display: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="loading">A carregar…</div>
  <div id="fallback">O teu navegador não suporta WebGL, necessário para esta pré-visualização 3D.</div>

  <!-- Babylon.js core + glTF/glb loader, from CDN. No build step. -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const loadingEl = document.getElementById("loading");
    const fallbackEl = document.getElementById("fallback");

    if (!BABYLON.Engine.isSupported()) {
      canvas.style.display = "none";
      loadingEl.style.display = "none";
      fallbackEl.style.display = "block";
    } else {
      const engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: true,
        stencil: true,
        alpha: true,
      });

      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); // transparent

      // --- Camera ---
      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        Math.PI / 2,    // alpha: face the shirt's front (Body_Front is the z>0 panel)
        Math.PI / 2.3,  // beta: slightly above eye-level
        6,              // radius: starting distance
        BABYLON.Vector3.Zero(),
        scene
      );
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 3;
      camera.upperRadiusLimit = 12;
      camera.wheelPrecision = 50;
      camera.lowerBetaLimit = 0.3;
      camera.upperBetaLimit = Math.PI - 0.3;
      camera.minZ = 0.01; // default (1) clips nearby geometry at this model's small scale

      // --- Lighting ---
      const fillLight = new BABYLON.HemisphericLight(
        "fillLight",
        new BABYLON.Vector3(0, 1, 0),
        scene
      );
      fillLight.intensity = 0.6;

      // Two key lights, mirrored front/back (z-component flipped), so
      // whichever panel the camera is orbited to face is lit — a single
      // one-sided key light left the opposite panel dim/gray whenever the
      // camera turned to view it (this model has separate front/back mesh
      // panels, not one continuous double-sided shell).
      const keyLight = new BABYLON.DirectionalLight(
        "keyLight",
        new BABYLON.Vector3(-1, -1.5, 1),
        scene
      );
      keyLight.position = new BABYLON.Vector3(4, 6, 4);
      keyLight.intensity = 0.9;

      const keyLightBack = new BABYLON.DirectionalLight(
        "keyLightBack",
        new BABYLON.Vector3(-1, -1.5, -1),
        scene
      );
      keyLightBack.position = new BABYLON.Vector3(4, 6, -4);
      keyLightBack.intensity = 0.9;

      const rimLight = new BABYLON.DirectionalLight(
        "rimLight",
        new BABYLON.Vector3(1, 0.3, 1),
        scene
      );
      rimLight.diffuse = new BABYLON.Color3(0.55, 0.75, 0.35); // event brand green
      rimLight.intensity = 0.05;

      // Idle auto-rotate
      let userInteracting = false;
      canvas.addEventListener("pointerdown", () => { userInteracting = true; });
      scene.onBeforeRenderObservable.add(() => {
        if (!userInteracting) {
          camera.alpha += 0.0015;
        }
      });

      let torso = null;
      let shirtBounds = null;

      function addPrintDecal(name, torsoMesh, bounds, texturePath, zSign, sizeMult) {
        sizeMult = sizeMult || { x: 2.3, y: 2.15, z: 3 };
        const center = bounds.centerWorld;
        const half = bounds.extendSizeWorld;

        // Print should cover the whole panel (collar to hem, side to side),
        // not just a centered patch — so the box spans the full width/height
        // of the panel (a little over, for full bleed to the edges/seams),
        // centered on the panel.
        const position = new BABYLON.Vector3(
          center.x,
          center.y,
          center.z + half.z * zSign
        );
        const normal = new BABYLON.Vector3(0, 0, zSign);
        // Decal size: full width/height of the panel (size.x/size.y are FULL
        // box dimensions, and half.x/half.y are HALF-extents, so half.x*2 is
        // the panel's full width) with a little overscan for full bleed.
        // Depth needs to be generous (not just the panel's own thin bounding
        // depth) so the projection box fully encloses the curved surface of
        // the panel — too shallow a box only captures a sliver near
        // dead-center where the curve happens to be exactly normal to the
        // projection direction. Smaller, more tightly-curved parts (sleeves)
        // need a shallower multiplier than the torso, tuned via sizeMult.
        const size = new BABYLON.Vector3(half.x * sizeMult.x, half.y * sizeMult.y, half.z * sizeMult.z);

        const decal = BABYLON.MeshBuilder.CreateDecal(name, torsoMesh, {
          position,
          normal,
          size,
          angle: 0,
        });

        const decalMat = new BABYLON.StandardMaterial(name + "Mat", scene);
        decalMat.diffuseTexture = new BABYLON.Texture(texturePath, scene);
        decalMat.diffuseTexture.hasAlpha = true;
        decalMat.useAlphaFromDiffuseTexture = true;
        decalMat.specularColor = new BABYLON.Color3(0, 0, 0);
        decalMat.zOffset = -2; // render slightly in front to avoid z-fighting
        decal.material = decalMat;

        return decal;
      }

      BABYLON.SceneLoader.ImportMeshAsync("", "assets/", "tshirt.glb", scene)
        .then((result) => {
          console.log(
            "Loaded meshes:",
            result.meshes.map((m) => m.name)
          );

          // This model's own glTF node names settle which panel is front vs
          // back (verified directly in the .glb JSON, not guessed from
          // camera angle): "Body_Front_Node_4" parents the z>0 panel,
          // "Body_Back_Node_5" parents the z<0 panel. Picking "front" by
          // largest-vertex-count (as an earlier version of this code did)
          // silently grabbed the back panel instead, since it happens to
          // have slightly more vertices — swapping the print textures.
          const bodyPanels = result.meshes.filter((m) => m.getTotalVertices() > 5000);
          torso = bodyPanels.find((m) => m.getBoundingInfo().boundingBox.centerWorld.z > 0);

          // Plain white base material, regardless of whatever material the
          // downloaded model shipped with.
          const baseMat = new BABYLON.StandardMaterial("baseMat", scene);
          baseMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.95);
          baseMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
          result.meshes.forEach((m) => {
            if (m.material) m.material = baseMat;
          });

          shirtBounds = torso.getBoundingInfo().boundingBox;
          console.log(
            "Torso bounds — center:", shirtBounds.centerWorld,
            "half-extents:", shirtBounds.extendSizeWorld
          );

          // Re-frame the camera on the actual model size.
          const radius = shirtBounds.extendSizeWorld.length() * 2.2;
          camera.setTarget(shirtBounds.centerWorld);
          camera.radius = radius;
          camera.lowerRadiusLimit = radius * 0.5;
          camera.upperRadiusLimit = radius * 2;

          // This model splits the garment into separate front/back panel
          // meshes rather than one continuous double-sided shell. "torso"
          // above is the confirmed front (Body_Front, z>0); find its
          // Body_Back counterpart (z<0) for the back print.
          const backMesh = bodyPanels.find(
            (m) => m !== torso && m.getBoundingInfo().boundingBox.centerWorld.z < 0
          );

          const frontDecal = addPrintDecal("frontDecal", torso, shirtBounds, "assets/front.png", 1);
          const backDecal = addPrintDecal("backDecal", backMesh, backMesh.getBoundingInfo().boundingBox, "assets/back.png", -1);

          // Sleeves are separate meshes too, offset to either side of center —
          // find them by X position rather than a hardcoded name.
          const leftSleeveMesh = result.meshes.find(
            (m) => m.getTotalVertices() > 0 && m.getBoundingInfo().boundingBox.centerWorld.x > 0.1
          );
          const rightSleeveMesh = result.meshes.find(
            (m) => m.getTotalVertices() > 0 && m.getBoundingInfo().boundingBox.centerWorld.x < -0.1
          );
          const sleeveSizeMult = { x: 1.6, y: 1.6, z: 1.2 };
          if (leftSleeveMesh) {
            addPrintDecal("leftSleeveDecal", leftSleeveMesh, leftSleeveMesh.getBoundingInfo().boundingBox, "assets/left-sleeve.png", 1, sleeveSizeMult);
          }
          if (rightSleeveMesh) {
            addPrintDecal("rightSleeveDecal", rightSleeveMesh, rightSleeveMesh.getBoundingInfo().boundingBox, "assets/right-sleeve.png", 1, sleeveSizeMult);
          }

          loadingEl.style.display = "none";
        })
        .catch((err) => {
          console.error("Failed to load tshirt.glb:", err);
          loadingEl.textContent = "Erro ao carregar o modelo 3D.";
        });

      engine.runRenderLoop(() => {
        scene.render();
      });

      window.addEventListener("resize", () => {
        engine.resize();
      });
    }
  </script>
</body>
</html>
