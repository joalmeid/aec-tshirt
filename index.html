<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Alimenta Esta Corrida 2026 — T-shirt 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000; /* simulates the website's black background */
      overflow: hidden;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #loading, #fallback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 1.1rem;
      text-align: center;
    }
    #fallback { display: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="loading">A carregar…</div>
  <div id="fallback">O teu navegador não suporta WebGL, necessário para esta pré-visualização 3D.</div>

  <!-- Babylon.js core + glTF/glb loader + Inspector, from CDN. No build step. -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const loadingEl = document.getElementById("loading");
    const fallbackEl = document.getElementById("fallback");

    if (!BABYLON.Engine.isSupported()) {
      canvas.style.display = "none";
      loadingEl.style.display = "none";
      fallbackEl.style.display = "block";
    } else {
      const engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: true,
        stencil: true,
        alpha: true,
      });

      // Playground-compatible shape: https://playground.babylonjs.com already
      // provides `canvas`/`engine` globals and calls `createScene()` the same
      // way (including awaiting it, since PG supports async createScene). To
      // experiment there, paste this function's body in over PG's default
      // createScene and iterate with its instant recompile; paste the result
      // back here when done. Sandbox (https://sandbox.babylonjs.com) is a
      // different tool — a drag-and-drop glTF/glb viewer with no scripting,
      // useful only for inspecting assets/tshirt.glb's own materials/UVs in
      // isolation from this file's decal code, not for iterating on the code.
      const createScene = async function () {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); // transparent

        // --- Camera ---
        const camera = new BABYLON.ArcRotateCamera(
          "camera",
          Math.PI / 2,    // alpha: face the shirt's front (Body_Front is the z>0 panel)
          Math.PI / 2.3,  // beta: slightly above eye-level
          6,              // radius: starting distance
          BABYLON.Vector3.Zero(),
          scene
        );
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 3;
        camera.upperRadiusLimit = 12;
        camera.wheelPrecision = 50;
        camera.lowerBetaLimit = 0.3;
        camera.upperBetaLimit = Math.PI - 0.3;
        camera.minZ = 0.01; // default (1) clips nearby geometry at this model's small scale

        // --- Lighting ---
        const fillLight = new BABYLON.HemisphericLight(
          "fillLight",
          new BABYLON.Vector3(0, 1, 0),
          scene
        );
        fillLight.intensity = 0.6;

        // Two key lights, mirrored front/back (z-component flipped), so
        // whichever panel the camera is orbited to face is lit — a single
        // one-sided key light left the opposite panel dim/gray whenever the
        // camera turned to view it (this model has separate front/back mesh
        // panels, not one continuous double-sided shell).
        const keyLight = new BABYLON.DirectionalLight(
          "keyLight",
          new BABYLON.Vector3(-1, -1.5, 1),
          scene
        );
        keyLight.position = new BABYLON.Vector3(4, 6, 4);
        keyLight.intensity = 0.9;

        const keyLightBack = new BABYLON.DirectionalLight(
          "keyLightBack",
          new BABYLON.Vector3(-1, -1.5, -1),
          scene
        );
        keyLightBack.position = new BABYLON.Vector3(4, 6, -4);
        keyLightBack.intensity = 0.9;

        const rimLight = new BABYLON.DirectionalLight(
          "rimLight",
          new BABYLON.Vector3(1, 0.3, 1),
          scene
        );
        rimLight.diffuse = new BABYLON.Color3(0.55, 0.75, 0.35); // event brand green
        rimLight.intensity = 0.05;

        // Idle auto-rotate
        let userInteracting = false;
        canvas.addEventListener("pointerdown", () => { userInteracting = true; });
        scene.onBeforeRenderObservable.add(() => {
          if (!userInteracting) {
            camera.alpha += 0.0015;
          }
        });

        // Inspector shown by default — for checking decal placement, UVs,
        // and material values directly against the loaded mesh while
        // iterating.
        scene.debugLayer.show({ embedMode: true });

        let torso = null;
        let shirtBounds = null;

        // For a badge that reads from the OUTER SIDE of the sleeve (like a
        // real sewn-on patch), not the front — projects along world X instead
        // of Z. Babylon builds the decal's own right/up axes from the normal:
        // with normal=(xSign,0,0), "right" (size.x) comes out along world Z
        // and "up" (size.y) stays world Y — confirmed non-mirrored in testing.
        function addSideDecal(name, mesh, bounds, texturePath, xSign, size, angle, yOffsetFrac, zOffsetFrac) {
          const center = bounds.centerWorld;
          const half = bounds.extendSizeWorld;
          const position = new BABYLON.Vector3(
            center.x + half.x * xSign,
            center.y + half.y * (yOffsetFrac || 0),
            center.z + half.z * (zOffsetFrac || 0)
          );
          const normal = new BABYLON.Vector3(xSign, 0, 0);

          const decal = BABYLON.MeshBuilder.CreateDecal(name, mesh, {
            position,
            normal,
            size,
            angle: angle || 0,
          });

          const decalMat = new BABYLON.StandardMaterial(name + "Mat", scene);
          decalMat.diffuseTexture = new BABYLON.Texture(texturePath, scene);
          decalMat.diffuseTexture.hasAlpha = true;
          decalMat.useAlphaFromDiffuseTexture = true;
          decalMat.specularColor = new BABYLON.Color3(0, 0, 0);
          decalMat.zOffset = -2;
          // Mirrored meshes (e.g. a mirrored sleeve copy) can have inverted
          // triangle winding, which makes an otherwise correctly-positioned
          // decal invisible under default backface culling — confirmed via a
          // throwaway oversized test decal that only appeared once culling
          // was disabled. Disabling it here is safe: decals are thin overlays
          // with no back side that needs hiding.
          decalMat.backFaceCulling = false;
          decal.material = decalMat;
          return decal;
        }

        function addPrintDecal(name, torsoMesh, bounds, texturePath, zSign, sizeMult, angle, yOffsetFrac, xOffsetFrac) {
          sizeMult = sizeMult || { x: 2.3, y: 2.15, z: 3 };
          const center = bounds.centerWorld;
          const half = bounds.extendSizeWorld;

          // Print should cover the whole panel (collar to hem, side to side),
          // not just a centered patch — so the box spans the full width/height
          // of the panel (a little over, for full bleed to the edges/seams),
          // centered on the panel. yOffsetFrac/xOffsetFrac (fraction of
          // half.y/half.x) shift the print from center for panels where the
          // visible logo should sit off-center (e.g. a sleeve badge, not full
          // coverage).
          const position = new BABYLON.Vector3(
            center.x + half.x * (xOffsetFrac || 0),
            center.y + half.y * (yOffsetFrac || 0),
            center.z + half.z * zSign
          );
          const normal = new BABYLON.Vector3(0, 0, zSign);
          // Decal size: full width/height of the panel (size.x/size.y are FULL
          // box dimensions, and half.x/half.y are HALF-extents, so half.x*2 is
          // the panel's full width) with a little overscan for full bleed.
          // Depth needs to be generous (not just the panel's own thin bounding
          // depth) so the projection box fully encloses the curved surface of
          // the panel — too shallow a box only captures a sliver near
          // dead-center where the curve happens to be exactly normal to the
          // projection direction. Smaller, more tightly-curved parts (sleeves)
          // need a shallower multiplier than the torso, tuned via sizeMult.
          const size = new BABYLON.Vector3(half.x * sizeMult.x, half.y * sizeMult.y, half.z * sizeMult.z);

          const decal = BABYLON.MeshBuilder.CreateDecal(name, torsoMesh, {
            position,
            normal,
            size,
            angle: angle || 0,
          });

          const decalMat = new BABYLON.StandardMaterial(name + "Mat", scene);
          decalMat.diffuseTexture = new BABYLON.Texture(texturePath, scene);
          decalMat.diffuseTexture.hasAlpha = true;
          decalMat.useAlphaFromDiffuseTexture = true;
          decalMat.specularColor = new BABYLON.Color3(0, 0, 0);
          decalMat.zOffset = -2; // render slightly in front to avoid z-fighting
          // See addSideDecal's comment: mirrored-mesh winding can otherwise
          // hide a correctly-positioned decal under default backface culling.
          decalMat.backFaceCulling = false;
          decal.material = decalMat;

          return decal;
        }

        try {
          const result = await BABYLON.SceneLoader.ImportMeshAsync("", "assets/", "tshirt.glb", scene);

          console.log(
            "Loaded meshes:",
            result.meshes.map((m) => m.name)
          );

          // This model's own glTF node names settle which panel is front vs
          // back (verified directly in the .glb JSON, not guessed from
          // camera angle): "Body_Front_Node_4" parents the z>0 panel,
          // "Body_Back_Node_5" parents the z<0 panel. Picking "front" by
          // largest-vertex-count (as an earlier version of this code did)
          // silently grabbed the back panel instead, since it happens to
          // have slightly more vertices — swapping the print textures.
          const bodyPanels = result.meshes.filter((m) => m.getTotalVertices() > 5000);
          torso = bodyPanels.find((m) => m.getBoundingInfo().boundingBox.centerWorld.z > 0);

          // Plain white base material, regardless of whatever material the
          // downloaded model shipped with.
          const baseMat = new BABYLON.StandardMaterial("baseMat", scene);
          baseMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.95);
          baseMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
          result.meshes.forEach((m) => {
            if (m.material) m.material = baseMat;
          });

          shirtBounds = torso.getBoundingInfo().boundingBox;
          console.log(
            "Torso bounds — center:", shirtBounds.centerWorld,
            "half-extents:", shirtBounds.extendSizeWorld
          );

          // Re-frame the camera on the actual model size.
          const radius = shirtBounds.extendSizeWorld.length() * 2.2;
          camera.setTarget(shirtBounds.centerWorld);
          camera.radius = radius;
          camera.lowerRadiusLimit = radius * 0.5;
          camera.upperRadiusLimit = radius * 2;

          // This model splits the garment into separate front/back panel
          // meshes rather than one continuous double-sided shell. "torso"
          // above is the confirmed front (Body_Front, z>0); find its
          // Body_Back counterpart (z<0) for the back print.
          const backMesh = bodyPanels.find(
            (m) => m !== torso && m.getBoundingInfo().boundingBox.centerWorld.z < 0
          );

          const frontDecal = addPrintDecal(
            "frontDecal", torso, shirtBounds, "assets/front.png", 1,
            { x: 3.0, y: 2.25, z: 3 }, 0, 0.21
          );
          const backDecal = addPrintDecal("backDecal", backMesh, backMesh.getBoundingInfo().boundingBox, "assets/back.png", -1);

          // Sleeves are separate meshes too, offset to either side of center —
          // find them by X position rather than a hardcoded name. "Left"/
          // "right" here follow the WEARER's own left/right (standard
          // garment convention, matching the PSD's "Left Sleeve FV" /
          // "Right Sleeve FV" layer names), mirrored from the viewer's
          // perspective. Confirmed by direct on-screen test (solid red/blue
          // materials, screenshotted): x>0.1 renders on the VIEWER'S LEFT,
          // x<-0.1 on the viewer's right — the opposite of what earlier
          // comments here assumed, which is why this swapped twice before.
          const leftSleeveMesh = result.meshes.find(
            (m) => m.getTotalVertices() > 0 && m.getBoundingInfo().boundingBox.centerWorld.x < -0.1
          );
          const rightSleeveMesh = result.meshes.find(
            (m) => m.getTotalVertices() > 0 && m.getBoundingInfo().boundingBox.centerWorld.x > 0.1
          );
          const sleeveSizeMult = { x: 2.6, y: 2.6, z: 1.6 };
          if (leftSleeveMesh) {
            // On the OUTER SIDE of the sleeve (like a real sewn-on patch) —
            // only visible when orbited to a side/profile view, not from the
            // straight-on front. Logo asset is 7977x760 (wide, thin banner).
            const lb = leftSleeveMesh.getBoundingInfo().boundingBox;
            const lh = lb.extendSizeWorld;
            addSideDecal(
              "leftSleeveDecal", leftSleeveMesh, lb, "assets/left-sleeve.png",
              -1, new BABYLON.Vector3(lh.z * 1.4, lh.y * 0.12, lh.x * 1.5),
              0, -0.15, 0
            );
            // Shoulder accent stripes (cropped from the front torso design's
            // own top-right corner, since a decal can only render on the
            // mesh it was created for — this content can't "spill over" from
            // the separate torso decal onto the sleeve mesh). Front-facing,
            // near the top of the sleeve.
            addPrintDecal(
              "leftSleeveAccentDecal", leftSleeveMesh, lb, "assets/shoulder-accent.png",
              1, { x: 2.6, y: 0.75, z: 1.5 }, 0, 0.35
            );
          }
          if (rightSleeveMesh) {
            addPrintDecal("rightSleeveDecal", rightSleeveMesh, rightSleeveMesh.getBoundingInfo().boundingBox, "assets/right-sleeve.png", 1, sleeveSizeMult, 0, -0.1);
          }

          loadingEl.style.display = "none";
        } catch (err) {
          console.error("Failed to load tshirt.glb:", err);
          loadingEl.textContent = "Erro ao carregar o modelo 3D.";
        }

        return scene;
      };

      createScene().then((scene) => {
        engine.runRenderLoop(() => {
          scene.render();
        });
      });

      window.addEventListener("resize", () => {
        engine.resize();
      });
    }
  </script>
</body>
</html>
